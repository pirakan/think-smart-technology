<svg width="640" height="500" viewBox="0 0 640 500"
     fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="whoPanel"
                        x1="90" y1="70"
                        x2="550" y2="430">
            <stop stop-color="#0E2A47"/>
            <stop offset="0.58" stop-color="#0A58CA"/>
            <stop offset="1" stop-color="#00C6FB"/>
        </linearGradient>

        <linearGradient id="whoScreen"
                        x1="130" y1="120"
                        x2="500" y2="340">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#EAF7FC"/>
        </linearGradient>
    </defs>

    <!-- Decorative circles -->

    <circle cx="520" cy="95" r="92"
            fill="#00C6FB"

<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="capMobileRepair"
                        x1="10" y1="8"
                        x2="54" y2="56">
            <stop stop-color="#00C6FB"/>
            <stop offset="1" stop-color="#0A58CA"/>
        </linearGradient>
    </defs>

    <!-- Smartphone -->
    <rect x="19" y="8" width="26" height="48" rx="5"
          fill="#0E2A47"
          stroke="url(#capMobileRepair)"
          stroke-width="2.5"/>

    <!-- Screen -->
    <rect x="23" y="15" width="18" height="30" rx="2"
          stroke="#00C6FB"
          stroke-width="1.6"
          opacity="0.85"/>

    <!-- Circuit / repair detail -->
    <path d="M27 25H31L34 22L37 25"
          stroke="#00C6FB"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <circle cx="27" cy="25" r="1.5" fill="#00C6FB"/>
    <circle cx="37" cy="25" r="1.5" fill="#00C6FB"/>

    <!-- Home button -->
    <circle cx="32" cy="50" r="2"
            stroke="#00C6FB"
            stroke-width="1.5"/>

    <!-- Repair screwdriver -->
    <path d="M45 37L51 31"
          stroke="#00C6FB"
          stroke-width="2.4"
          stroke-linecap="round"/>

    <path d="M49 29L53 33"
          stroke="#00C6FB"
          stroke-width="2.4"
          stroke-linecap="round"/>

    <path d="M44 38L48 42"
          stroke="#00C6FB"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Repair gear -->
    <circle cx="51" cy="43" r="6"
            fill="#0E2A47"
            stroke="#00C6FB"
            stroke-width="1.7"/>

    <circle cx="51" cy="43" r="2"
            fill="#00C6FB"/>

    <!-- Connection nodes -->
    <circle cx="12" cy="22" r="2" fill="#00C6FB"/>
    <circle cx="12" cy="42" r="2" fill="#00C6FB"/>

    <path d="M14 22H19M14 42H19"
          stroke="#00C6FB"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.65"/>

</svg>
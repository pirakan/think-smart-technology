<svg width="760" height="620" viewBox="0 0 760 620" fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient
            id="screenGradient"
            x1="180"
            y1="90"
            x2="590"
            y2="470"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#0A58CA"/>
            <stop offset="0.55" stop-color="#0E2A47"/>
            <stop offset="1" stop-color="#06182B"/>
        </linearGradient>

        <linearGradient
            id="cyanGradient"
            x1="300"
            y1="180"
            x2="520"
            y2="400"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#00C6FB"/>
            <stop offset="1" stop-color="#0A58CA"/>
        </linearGradient>

        <linearGradient
            id="glassGradient"
            x1="120"
            y1="100"
            x2="640"
            y2="500"
            gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="white" stop-opacity="0.16"/>
            <stop offset="1" stop-color="white" stop-opacity="0.03"/>
        </linearGradient>

        <radialGradient
            id="glow"
            cx="0"
            cy="0"
            r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(440 300) rotate(90) scale(220)"
        >
            <stop stop-color="#00C6FB" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#00C6FB" stop-opacity="0"/>
        </radialGradient>

        <filter
            id="shadow"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%"
        >
            <feDropShadow
                dx="0"
                dy="24"
                stdDeviation="25"
                flood-color="#000B18"
                flood-opacity="0.38"
            />
        </filter>

        <filter
            id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >
            <feGaussianBlur stdDeviation="12"/>
        </filter>

        <filter
            id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >
            <feGaussianBlur stdDeviation="5"/>
        </filter>

        <pattern
            id="miniGrid"
            width="28"
            height="28"
            patternUnits="userSpaceOnUse"
        >
            <path
                d="M28 0H0V28"
                stroke="#00C6FB"
                stroke-opacity="0.10"
                stroke-width="1"
            />
        </pattern>

    </defs>



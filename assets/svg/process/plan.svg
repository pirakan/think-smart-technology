<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="processPlan"
                        x1="9" y1="8"
                        x2="55" y2="56">
            <stop stop-color="#00C6FB"/>
            <stop offset="1" stop-color="#0A58CA"/>
        </linearGradient>
    </defs>

    <!-- Planning board -->
    <rect x="12" y="10" width="40" height="44" rx="6"
          fill="#F4F7FB"
          stroke="url(#processPlan)"
          stroke-width="2.5"/>

    <!-- Header -->
    <path d="M12 22H52"
          stroke="#0E2A47"
          stroke-width="1.8"/>

    <!-- Calendar dots -->
    <circle cx="21" cy="16" r="2"
            fill="#00C6FB"/>

    <circle cx="43" cy="16" r="2"
            fill="#00C6FB"/>

    <!-- Plan lines -->
    <path d="M20 29H43"
          stroke="#0E2A47"
          stroke-width="2"
          stroke-linecap="round"/>

    <path d="M20 36H38"
          stroke="#0E2A47"
          stroke-width="2"
          stroke-linecap="round"/>

    <path d="M20 43H33"
          stroke="#0E2A47"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Check marks -->
    <path d="M17 29L18.5 30.5L21 27.5"
          stroke="#00C6FB"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M17 36L18.5 37.5L21 34.5"
          stroke="#00C6FB"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M17 43L18.5 44.5L21 41.5"
          stroke="#0A58CA"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Digital planning nodes -->
    <circle cx="55" cy="29" r="2"
            fill="#00C6FB"/>

    <circle cx="55" cy="45" r="2"
            fill="#0A58CA"/>

    <path d="M52 29H55M52 45H55"
          stroke="#00C6FB"
          stroke-width="1.3"
          opacity="0.65"/>

</svg>
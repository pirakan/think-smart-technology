<svg width="1600" height="520" viewBox="0 0 1600 520"
     fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="ctaGlow" x1="0" y1="0" x2="1600" y2="520">
            <stop stop-color="#0E2A47"/>
            <stop offset="0.55" stop-color="#0A58CA"/>
            <stop offset="1" stop-color="#06365D"/>
        </linearGradient>

        <radialGradient id="cyanGlow">
            <stop stop-color="#00C6FB" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#00C6FB" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Main background -->
    <rect width="1600" height="520" fill="url(#ctaGlow)"/>

    <!-- Soft cyan glow -->
    <circle cx="1370" cy="100" r="330" fill="url(#cyanGlow)"/>

    <circle cx="230" cy="470" r="250"
            fill="#00C6FB"
            fill-opacity="0.045"/>

    <!-- Technical grid -->
    <g opacity="0.10" stroke="#FFFFFF" stroke-width="1">
        <path d="M0 80H1600"/>
        <path d="M0 160H1600"/>
        <path d="M0 240H1600"/>
        <path d="M0 320H1600"/>
        <path d="M0 400H1600"/>
        <path d="M0 480H1600"/>

        <path d="M120 0V520"/>
        <path d="M280 0V520"/>
        <path d="M440 0V520"/>
        <path d="M600 0V520"/>
        <path d="M760 0V520"/>
        <path d="M920 0V520"/>
        <path d="M1080 0V520"/>
        <path d="M1240 0V520"/>
        <path d="M1400 0V520"/>
        <path d="M1560 0V520"/>
    </g>

    <!-- Abstract connection lines -->
    <g stroke="#00C6FB" stroke-width="1.5" opacity="0.35">
        <path d="M1030 420L1170 300L1300 340L1450 180L1600 220"/>
        <path d="M1120 520L1250 390L1390 420L1510 310L1600 350"/>
        <path d="M0 390L150 330L280 370L390 270"/>
    </g>

    <!-- Nodes -->
    <g fill="#00C6FB">
        <circle cx="1170" cy="300" r="4"/>
        <circle cx="1300" cy="340" r="4"/>
        <circle cx="1450" cy="180" r="5"/>
        <circle cx="1510" cy="310" r="4"/>
        <circle cx="150" cy="330" r="4"/>
        <circle cx="280" cy="370" r="3"/>
    </g>

    <!-- Large decorative rings -->
    <circle cx="1390" cy="245" r="115"
            stroke="#00C6FB"
            stroke-width="1"
            opacity="0.14"/>

    <circle cx="1390" cy="245" r="155"
            stroke="#FFFFFF"
            stroke-width="1"
            stroke-dasharray="5 12"
            opacity="0.08"/>

    <!-- Small circuit details -->
    <path d="M1280 100H1340L1370 70H1430"
          stroke="#00C6FB"
          stroke-width="2"
          opacity="0.25"/>

    <circle cx="1280" cy="100" r="4" fill="#00C6FB"/>

    <path d="M150 130H220L250 100H320"
          stroke="#00C6FB"
          stroke-width="2"
          opacity="0.20"/>

    <circle cx="150" cy="130" r="4" fill="#00C6FB"/>

</svg>
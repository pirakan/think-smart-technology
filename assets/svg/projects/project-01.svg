<svg width="640" height="400" viewBox="0 0 640 400" fill="none"
     xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="webBg" x1="70" y1="35" x2="570" y2="365">
            <stop stop-color="#0E2A47"/>
            <stop offset="0.58" stop-color="#0A58CA"/>
            <stop offset="1" stop-color="#00C6FB"/>
        </linearGradient>

        <linearGradient id="screenGlow" x1="120" y1="90" x2="520" y2="300">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#EAF7FC"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="20" y="20" width="600" height="360" rx="28"
          fill="#F4F7FB"/>

    <rect x="20" y="20" width="600" height="360" rx="28"
          stroke="#D8E6F0"
          stroke-width="2"/>

    <!-- Decorative glow -->
    <circle cx="560" cy="75" r="90"

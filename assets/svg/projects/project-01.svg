    <!-- Lower content blocks -->
    <rect x="112" y="284" width="126" height="22" rx="7"
          fill="#E7EFF4"/>

    <rect x="256" y="284" width="126" height="22" rx="7"
          fill="#E7EFF4"/>

    <rect x="400" y="284" width="126" height="22" rx="7"

            fill-opacity="0.08"/>

    <circle cx="75" cy="325" r="100"
            fill="#0A58CA"
            fill-opacity="0.06"/>

    <!-- Browser -->
    <rect x="82" y="62" width="476" height="276" rx="16"
          fill="#FFFFFF"
          stroke="url(#webBg)"
          stroke-width="2.5"/>

    <!-- Browser top -->
    <path d="M82 102H558"
          stroke="#DCE8F0"
          stroke-width="1.5"/>

    <circle cx="108" cy="82" r="5"
            fill="#00C6FB"/>

    <circle cx="126" cy="82" r="5"
            fill="#0A58CA"
            fill-opacity="0.7"/>

    <circle cx="144" cy="82" r="5"
            fill="#0E2A47"
            fill-opacity="0.45"/>

    <!-- Navigation -->
    <rect x="112" y="119" width="105" height="8" rx="4"
